name: Astro CI/CD

on:
  push:
    branches:
      - develop
    paths:
      - "astro-site/**"
      - "notes/**"
      - "projects/**"
      - "interviews/**"
      - ".github/workflows/astro.yaml"

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ECR_REPOSITORY: portfolio-astro
    steps:
      - name: Checkout repo source
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        run: |
          echo "${{ secrets.DOCKER_HUB_PASSWORD }}" | docker login --username ${{ secrets.DOCKER_HUB_USERNAME }} --password-stdin

      - name: Build, tag, and push
        id: build-image
        env:
          ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
          RUNNER_ID: ${{ github.run_number }}
        run: |
          cd astro-site
          IMAGE_TAG=$RUNNER_ID
          IMAGE_REPO_NAME=$ECR_REGISTRY/$ECR_REPOSITORY
          LATEST_IMAGE=$IMAGE_REPO_NAME:latest
          echo "Pulling latest image"
          docker pull $LATEST_IMAGE || true
          echo "Building images"
          docker build --cache-from $LATEST_IMAGE -t $IMAGE_REPO_NAME:latest -t $IMAGE_REPO_NAME:$IMAGE_TAG .
          echo "Pushing images to ECR..."
          docker push $IMAGE_REPO_NAME:latest
          docker push $IMAGE_REPO_NAME:$IMAGE_TAG
          echo "New image name=$IMAGE_REPO_NAME:$IMAGE_TAG"

  deploy:
    needs: [build]
    runs-on: ubuntu-latest
    env:
      ECR_REPOSITORY: portfolio-astro
      ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
      RUNNER_ID: ${{ github.run_number }}
    steps:
      - name: Deploy
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            IMAGE_REPO_NAME=${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}
            IMAGE_TAG=${{ env.RUNNER_ID }}

            cd ~

            # Pull new image
            echo "Pulling new image: $IMAGE_REPO_NAME:$IMAGE_TAG"
            docker pull $IMAGE_REPO_NAME:$IMAGE_TAG

            # Tag as latest for docker-compose
            docker tag $IMAGE_REPO_NAME:$IMAGE_TAG $IMAGE_REPO_NAME:latest

            # Copy view_counts.txt from container before stopping (preserve data)
            docker cp portfolio-astro:/view_counts.txt ./view_counts_backup.txt 2>/dev/null || echo "No existing view_counts.txt to backup"

            # Stop and remove old container
            docker-compose stop portfolio-astro || true
            docker-compose rm --force portfolio-astro || true

            # Start new container with latest image
            docker-compose up -d portfolio-astro

            # Wait for container to be ready
            echo "Waiting for container to start..."
            sleep 5

            # Restore view_counts.txt if backup exists
            if [ -f ./view_counts_backup.txt ]; then
              docker cp ./view_counts_backup.txt portfolio-astro:/view_counts.txt
              echo "Restored view_counts.txt"
            fi

            echo "Deployed new image: $IMAGE_REPO_NAME:$IMAGE_TAG"

            # Cleanup old images (keep last 2)
            docker images $IMAGE_REPO_NAME --format "{{.ID}} {{.Tag}}" | grep -v latest | tail -n +3 | awk '{print $1}' | xargs -r docker rmi || true
            echo "Cleanup completed"
