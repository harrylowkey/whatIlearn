version: '3.8'

services:
  portfolio-astro:
    image: hongquangraem/portfolio-astro:latest
    container_name: portfolio-astro
    restart: unless-stopped
    ports:
      - "4321:4321"
    environment:
      - NODE_ENV=production
      - HOST=0.0.0.0
      - PORT=4321
    volumes:
      - ./view_counts.txt:/view_counts.txt
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4321"]
      interval: 30s
      timeout: 10s
      retries: 3
